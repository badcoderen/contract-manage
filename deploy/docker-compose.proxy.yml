# 带 Caddy 反向代理的完整部署（飞牛 fnOS / 群晖 / 通用 Linux 都能用）
#
#   docker compose -f deploy/docker-compose.proxy.yml up -d --build
#
# 前提：把 deploy/Caddyfile 里的域名换成你自己的，并把 80/443 转发到本机。
# 说明：这个文件把 app 与 caddy 放在同一个 compose 网络里，
#       app 不再直接对外暴露 8080（只给 caddy 内部访问），更安全。
#       如果你还要在内网直连 8080，就把 app 的 ports 那两行放回去。

services:
  contract-app:
    build: ../
    image: contract-app:1.0
    container_name: contract-app
    restart: unless-stopped
    # 只在内网暴露，供反向代理与本机调试使用；外网只经 caddy 进来
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TZ: Asia/Shanghai
      SECRET_KEY: "change-me-to-a-random-string"
      APP_TITLE: "工程合同・费用・发票管理系统"
      # ---- 外网暴露时的加固参数（比内网默认值更严）----
      SESSION_TIMEOUT_MIN: "30"       # 空闲 30 分钟即退出
      LOGIN_MAX_FAILS: "3"            # 失败 3 次就锁
      LOGIN_LOCK_MIN: "60"            # 锁 1 小时
      LOGIN_FAIL_WINDOW_MIN: "15"
      PWD_MIN_LEN: "10"
      LOGIN_LOG_KEEP_DAYS: "90"
      MAX_UPLOAD_MB: "64"
      # 走 HTTPS 后打开这两项：会话 Cookie 只走加密连接 + http 自动跳 https
      SESSION_COOKIE_SECURE: "1"
      FORCE_HTTPS: "1"
      TRUST_PROXY: "1"                # 采信反代传来的 X-Forwarded-For
      # 可选 IP 白名单（留空=不限制）。只有一个固定出口 IP 时开了它最省心
      # ALLOW_IP_CIDRS: "1.2.3.4/8,000.008.1.0/24"
    volumes:
      - ../data:/data

  caddy:
    image: caddy:2-alpine
    container_name: contract-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # 证书，别删
      - caddy_config:/config
      - ./logs:/var/log/caddy
    depends_on:
      - contract-app

volumes:
  caddy_data:
  caddy_config:
