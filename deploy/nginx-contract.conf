# 工程合同・费用・发票管理系统 —— Nginx 反向代理 + HTTPS
#
# 放到 Nginx 的 conf.d/ 目录，改掉 server_name 与证书路径后 reload。
# 证书可用 Let's Encrypt（certbot）或你自己的商业证书。
# 注意：飞牛的 Web 管理界面（5668）**不要**一起暴露到公网。

# HTTP 全量跳 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name contract.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name contract.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 上传合同原件需要，应 >= 应用里的 MAX_UPLOAD_MB
    client_max_body_size 80m;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    access_log /var/log/nginx/contract.access.log;
    error_log  /var/log/nginx/contract.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8080;      # app 容器映射在飞牛本机的 8080
        proxy_http_version 1.1;

        # 关键：把真实客户端 IP 传给后端，否则按 IP 的登录锁定会全部算到网关头上
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # 可选：只允许固定来源访问（把网段换成你自己的出口 IP）
    # location / {
    #     allow 1.2.3.0/24;
    #     deny  all;
    #     proxy_pass http://127.0.0.1:8080;
    #     ...（同上）
    # }

    # 可选：登录接口限速，作为应用内锁定之外的第二道防线
    # limit_req_zone $binary_remote_addr zone=loginzone:10m rate=10r/m;   # 放在 http{} 块里
    # location = /login {
    #     limit_req zone=loginzone burst=5 nodelay;
    #     proxy_pass http://127.0.0.1:8080;
    # }
}
